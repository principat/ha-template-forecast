name: Tests

on:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: pip install -r requirements_acceptance.txt

      # The REQ 2.8 acceptance scenarios run the dashboard card's logic in Node
      # (tests_acceptance/card_driver.py); in CI they fail instead of being skipped.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install card dependencies
        run: npm ci --prefix frontend

      - name: Run tests
        run: python -m pytest
