name: Label bug with version

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label-version:
    if: contains(github.event.issue.labels.*.name, 'bug')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            // Issue form renders: "### <label>\n\n<value>"
            const match = body.match(/### Template Forecast version[^\n]*\n+\s*v?(\d+\.\d+\.\d+)/);
            if (!match) {
              core.info('No version found in issue body');
              return;
            }
            const label = `version: ${match[1]}`;
            const current = issue.labels.map(l => l.name);
            // Remove outdated version labels if the version was edited
            for (const name of current) {
              if (name.startsWith('version: ') && name !== label) {
                await github.rest.issues.removeLabel({
                  ...context.repo, issue_number: issue.number, name,
                });
              }
            }
            if (current.includes(label)) return;
            try {
              await github.rest.issues.createLabel({
                ...context.repo, name: label, color: 'ededed',
              });
            } catch (e) {
              if (e.status !== 422) throw e; // already exists
            }
            await github.rest.issues.addLabels({
              ...context.repo, issue_number: issue.number, labels: [label],
            });
